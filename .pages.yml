# Pages CMS 설정 — https://app.pagescms.org 에서 이 repo를 열면 아래 화면이 만들어집니다.
# 문서: https://pagescms.org/docs/configuration/

media:
  input: assets/img/posts
  output: /assets/img/posts
  rename: safe
  categories: [image]

content:
  - name: posts
    label: 글
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    view:
      fields: [title, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 제목
        type: string
        required: true
        description: "앞에 [직접] / [AI 보조] / [AI 초안] 중 하나를 붙이세요."
      - name: date
        label: 게시 시각
        type: date
        required: true
        description: "지금보다 미래 시각이면 게시되지 않습니다."
        options:
          time: true
          format: "yyyy-MM-dd HH:mm:ss xx"
      - name: description
        label: 요약 (검색 결과·미리보기용)
        type: text
        description: "1~2문장. 비워 두면 본문 앞부분이 쓰입니다."
      - name: categories
        label: 카테고리 [상위, 하위]
        type: string
        list:
          min: 1
          max: 2
        description: "상위: Trends / Validation / Toolchain / DevOps / Development / Robotics — 하위는 자유 (예: Diagnostics, CI-CD)"
      - name: tags
        label: 태그
        type: string
        list: true
        description: "첫 태그는 작성 방식: 직접작성 / AI보조 / AI초안"
      - name: pin
        label: 상단 고정
        type: boolean
        default: false
      - name: image
        label: 대표 이미지 (선택)
        type: image
      - name: body
        label: 본문
        type: rich-text
        options:
          format: markdown
          path: assets/img/posts
          rename: safe

  - name: about
    label: About 페이지
    type: file
    path: _tabs/about.md
    format: yaml-frontmatter
    fields:
      - name: icon
        type: string
        hidden: true
      - name: order
        type: number
        hidden: true
      - name: body
        label: 본문
        type: rich-text
        options:
          format: markdown
